<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .kartica {
        width: 300px;
        height: 300px;
        background-color: blue;
      }
    </style>
  </head>
  <body>
    <p id="opis">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Animi assumenda
      modi quaerat sequi odit magni fugiat delectus quo ea ipsum. Perspiciatis
      explicabo sit repudiandae adipisci ut at neque molestias voluptatum.
    </p>
    <div class="kartica">

    </div>
    <button>Toggle</button>
    <script>
      let kartica = document.querySelector(".kartica");
      let gumb = document.querySelector("button");
      gumb.onclick = function() {
        kartica.classList.toggle("kartica");
      };
      let paragraf = document.getElementById("opis");
      paragraf.textContent = "Ja sam Ivan i idem u Tehničku školu SB";
    </script>
  </body>
</html>
